name: small-pool-show

services:
  web:
    image: ccr.ccs.tencentyun.com/gfcc-frontend/small-pool-show:${IMAGE_TAG:-latest}
    container_name: small-pool-show
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
